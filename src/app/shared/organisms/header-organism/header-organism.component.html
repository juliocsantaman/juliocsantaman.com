<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" [ngClass]="
    isScrolled
      ? 'bg-background/80 backdrop-blur-lg border-b border-border'
      : 'bg-transparent dark:bg-background'
  ">

  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- LOGO -->
      <button (click)="scrollToSection('home')" class="text-xl font-bold text-foreground dark:text-white"
        data-testid="button-logo">
        {{ 'ROOT.APP.ORGANISMS.HEADER_ORGANISM.LOGO' | translate }}
      </button>

      <!-- DESKTOP -->
      <div class="hidden md:flex items-center gap-8">
        <button *ngFor="let item of navItems" (click)="scrollToSection(item.id)"
          class="text-sm font-medium text-muted-foreground dark:text-muted-foreground hover:text-foreground dark:hover:text-white transition-colors"
          [attr.data-testid]="'link-nav-' + item.id">
          {{ item.label | translate }}
        </button>

        <!-- THEME TOGGLE -->
        <button (click)="toggleTheme()" class="inline-flex items-center justify-center rounded-md p-2
                 hover:bg-muted dark:hover:bg-muted/60 transition" data-testid="button-theme-toggle">
          <!-- Sun -->
          <svg *ngIf="isDark" class="w-5 h-5 text-foreground dark:text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364-1.414 1.414M7.05 16.95l-1.414 1.414M16.95 16.95l1.414 1.414M7.05 7.05 5.636 5.636M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>

          <!-- Moon -->
          <svg *ngIf="!isDark" class="w-5 h-5 text-foreground dark:text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
          </svg>
        </button>

        <!-- LANGUAGE SELECTOR -->
        <div class="relative">
          <button (click)="isLangMenuOpen = !isLangMenuOpen; $event.stopPropagation()" class="inline-flex items-center justify-center gap-1.5 rounded-md px-2 py-1
                   text-sm font-semibold text-foreground dark:text-white
                   hover:bg-muted dark:hover:bg-muted/60 transition"
            data-testid="button-lang-toggle"
            [attr.aria-label]="'Switch language'"
            [attr.aria-expanded]="isLangMenuOpen">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 21a9 9 0 100-18 9 9 0 000 18zm0 0c2.5-2.5 3.75-5.75 3.75-9S14.5 5.5 12 3m0 18c-2.5-2.5-3.75-5.75-3.75-9S9.5 5.5 12 3M3.5 9h17M3.5 15h17" />
            </svg>
            <span>{{ currentLang.toUpperCase() }}</span>
            <svg class="w-3 h-3 transition-transform" [class.rotate-180]="isLangMenuOpen"
              fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <div *ngIf="isLangMenuOpen"
            class="absolute right-0 mt-2 min-w-[10rem] rounded-md border border-border
                   bg-background shadow-lg overflow-hidden z-50">
            <button *ngFor="let lang of languages" (click)="selectLang(lang.code)"
              class="w-full flex items-center justify-between px-3 py-2 text-sm
                     text-foreground dark:text-white
                     hover:bg-muted dark:hover:bg-muted/60 transition-colors"
              [class.bg-muted]="lang.code === currentLang"
              [class.dark:bg-muted]="lang.code === currentLang"
              [attr.data-testid]="'button-lang-' + lang.code">
              <span>{{ lang.label }}</span>
              <span class="text-xs font-semibold text-muted-foreground">{{ lang.code.toUpperCase() }}</span>
            </button>
          </div>
        </div>
      </div>

      <!-- MOBILE -->
      <div class="md:hidden flex items-center gap-2">
        <!-- Theme toggle mobile -->
        <button (click)="toggleTheme()" class="inline-flex items-center justify-center rounded-md p-2
                 hover:bg-muted dark:hover:bg-muted/60 transition" data-testid="button-theme-toggle-mobile">
          <svg *ngIf="isDark" class="w-5 h-5 text-foreground dark:text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364-1.414 1.414M7.05 16.95l-1.414 1.414M16.95 16.95l1.414 1.414M7.05 7.05 5.636 5.636M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
          <svg *ngIf="!isDark" class="w-5 h-5 text-foreground dark:text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
          </svg>
        </button>

        <!-- Language selector mobile -->
        <div class="relative">
          <button (click)="isLangMenuMobileOpen = !isLangMenuMobileOpen; $event.stopPropagation()"
            class="inline-flex items-center justify-center gap-1.5 rounded-md px-2 py-1
                   text-sm font-semibold text-foreground dark:text-white
                   hover:bg-muted dark:hover:bg-muted/60 transition"
            data-testid="button-lang-toggle-mobile"
            [attr.aria-label]="'Switch language'"
            [attr.aria-expanded]="isLangMenuMobileOpen">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 21a9 9 0 100-18 9 9 0 000 18zm0 0c2.5-2.5 3.75-5.75 3.75-9S14.5 5.5 12 3m0 18c-2.5-2.5-3.75-5.75-3.75-9S9.5 5.5 12 3M3.5 9h17M3.5 15h17" />
            </svg>
            <span>{{ currentLang.toUpperCase() }}</span>
          </button>

          <div *ngIf="isLangMenuMobileOpen"
            class="absolute right-0 mt-2 min-w-[10rem] rounded-md border border-border
                   bg-background shadow-lg overflow-hidden z-50">
            <button *ngFor="let lang of languages" (click)="selectLang(lang.code)"
              class="w-full flex items-center justify-between px-3 py-2 text-sm
                     text-foreground dark:text-white
                     hover:bg-muted dark:hover:bg-muted/60 transition-colors"
              [class.bg-muted]="lang.code === currentLang"
              [class.dark:bg-muted]="lang.code === currentLang"
              [attr.data-testid]="'button-lang-mobile-' + lang.code">
              <span>{{ lang.label }}</span>
              <span class="text-xs font-semibold text-muted-foreground">{{ lang.code.toUpperCase() }}</span>
            </button>
          </div>
        </div>

        <!-- Menu toggle mobile -->
        <button (click)="isMobileMenuOpen = !isMobileMenuOpen" class="inline-flex items-center justify-center rounded-md p-2
                 hover:bg-muted dark:hover:bg-muted/60 transition" data-testid="button-menu-toggle">
          <svg *ngIf="isMobileMenuOpen" class="w-5 h-5 text-foreground dark:text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>

          <svg *ngIf="!isMobileMenuOpen" class="w-5 h-5 text-foreground dark:text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- MOBILE MENU -->
  <div *ngIf="isMobileMenuOpen"
    class="md:hidden bg-background border-t border-border dark:bg-background dark:border-border">
    <div class="px-4 py-4 space-y-3">
      <button *ngFor="let item of navItems" (click)="scrollToSection(item.id)" class="block w-full text-left px-4 py-2 text-sm font-medium
               text-muted-foreground dark:text-muted-foreground
               hover:text-foreground dark:hover:text-white
               hover:bg-muted dark:hover:bg-muted/60
               rounded-md transition-colors" [attr.data-testid]="'link-mobile-nav-' + item.id">
        {{ item.label | translate }}
      </button>
    </div>
  </div>
</nav>
