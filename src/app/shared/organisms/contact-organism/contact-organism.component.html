<section id="contact" class="py-20 sm:py-32 bg-muted/30 dark:bg-background text-foreground">
  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="space-y-12">

      <!-- Header -->
      <div class="space-y-4 text-center">
        <h2 class="text-3xl sm:text-4xl font-bold tracking-tight">
          Get In Touch
        </h2>
        <div class="h-1 w-20 bg-primary rounded-full mx-auto"></div>
        <p class="text-lg text-muted-foreground dark:text-muted-foreground max-w-2xl mx-auto">
          I'm always open to discussing new projects, creative ideas, or opportunities to be part of your vision.
        </p>
      </div>

      <div class="grid lg:grid-cols-2 gap-12 max-w-5xl mx-auto">

        <!-- Info -->
        <div class="space-y-8 lg:col-span-2 flex flex-col items-center text-center">

          <!-- Contact Info -->
          <div class="space-y-4">
            <h3 class="text-xl font-semibold text-foreground dark:text-white">
              Contact Information
            </h3>
            <div class="p-6 bg-card border border-border rounded-lg max-w-md">
              <img src="assets/img/email.png" alt="Email icon" class="w-48 mx-auto" />
            </div>
          </div>

          <!-- Follow Me -->
          <div class="space-y-4">
            <h3 class="text-xl font-semibold text-foreground dark:text-white">
              Follow Me
            </h3>
            <div class="flex gap-4 justify-center">
              <a [href]="'ROOT.APP.ORGANISMS.FOOTER_ORGANISM.URLS.U6.URL' | translate" target="_blank" class="flex items-center justify-center border border-primary text-primary
                        h-12 w-12 rounded-lg hover:bg-primary/10 dark:hover:bg-primary/20 transition-all">
                <i class="fab fa-github text-xl"></i>
              </a>

              <a [href]="'ROOT.APP.ORGANISMS.FOOTER_ORGANISM.URLS.U1.URL' | translate" target="_blank" class="flex items-center justify-center border border-primary text-primary
                        h-12 w-12 rounded-lg hover:bg-primary/10 dark:hover:bg-primary/20 transition-all">
                <i class="fab fa-linkedin text-xl"></i>
              </a>
            </div>
          </div>

          <!-- Response Time -->
          <div class="p-6 bg-card border border-border rounded-lg max-w-md hover:shadow-md transition-all">
            <p class="text-sm text-muted-foreground dark:text-muted-foreground">
              <span class="font-semibold text-foreground dark:text-white">Response Time:</span>
              I typically respond within 24 hours during weekdays.
            </p>
          </div>

        </div>

      </div>

    </div>
  </div>
</section>
