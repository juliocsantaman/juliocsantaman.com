<section id="contact" class="py-20 sm:py-32 bg-muted/30">
  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="space-y-12">

      <!-- Header -->
      <div class="space-y-4 text-center">
        <h2 class="text-3xl sm:text-4xl font-bold tracking-tight">Get In Touch</h2>
        <div class="h-1 w-20 bg-primary rounded-full mx-auto"></div>
        <p class="text-lg text-muted-foreground max-w-2xl mx-auto">
          I'm always open to discussing new projects, creative ideas, or opportunities to be part of your vision.
        </p>
      </div>

      <div class="grid lg:grid-cols-2 gap-12 max-w-5xl mx-auto">

        <!-- Form Card -->
        <div class="bg-card border border-card-border rounded-lg p-8 shadow-sm">
          <form [formGroup]="contactForm" (ngSubmit)="submitForm()" class="space-y-6">

            <!-- Name -->
            <div class="space-y-2">
              <label for="name" class="block text-sm font-medium text-foreground">Name</label>
              <input id="name" formControlName="name" placeholder="Your name"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                [disabled]="isSubmitting" />
            </div>

            <!-- Email -->
            <div class="space-y-2">
              <label for="email" class="block text-sm font-medium text-foreground">Email</label>
              <input id="email" type="email" formControlName="email" placeholder="your.email@example.com"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                [disabled]="isSubmitting" />
            </div>

            <!-- Message -->
            <div class="space-y-2">
              <label for="message" class="block text-sm font-medium text-foreground">Message</label>
              <textarea id="message" rows="5" formControlName="message" placeholder="Tell me about your project..."
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                [disabled]="isSubmitting"></textarea>
            </div>

            <button type="submit"
              class="w-full inline-flex items-center justify-center px-4 py-2 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 transition-all"
              [disabled]="isSubmitting">
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
              </svg>
              {{ isSubmitting ? 'Sending...' : 'Send Message' }}
            </button>

          </form>
        </div>

        <!-- Contact Info & Social -->
        <div class="space-y-8">
          <div class="space-y-6">
            <h3 class="text-xl font-semibold text-foreground">Contact Information</h3>
            <div>
              <a href="mailto:developer@example.com"
                class="flex items-center gap-3 text-muted-foreground hover:text-foreground transition-colors">
                <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="2"
                  viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 12H8m8 0a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <span>developer@example.com</span>
              </a>
            </div>
          </div>

          <div class="space-y-6">
            <h3 class="text-xl font-semibold text-foreground">Follow Me</h3>
            <div class="flex gap-4">
              <button (click)="openSocial('https://github.com/yourusername')"
                class="flex items-center justify-center border border-primary text-primary h-12 w-12 rounded-lg hover:bg-primary/10 transition-all">
                <i class="fab fa-github text-xl"></i>
              </button>
              <button (click)="openSocial('https://linkedin.com/in/yourusername')"
                class="flex items-center justify-center border border-primary text-primary h-12 w-12 rounded-lg hover:bg-primary/10 transition-all">
                <i class="fab fa-linkedin text-xl"></i>
              </button>
            </div>
          </div>

          <div class="bg-primary/5 border border-primary/20 p-6 rounded-lg">
            <p class="text-sm text-muted-foreground">
              <span class="font-semibold text-foreground">Response Time:</span> I typically respond within 24 hours
              during weekdays.
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
