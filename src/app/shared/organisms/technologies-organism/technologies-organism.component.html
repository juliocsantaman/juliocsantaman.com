<section id="technologies" class="py-20 sm:py-32 bg-muted/30">
  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="space-y-12">

      <!-- Header -->
      <div class="space-y-4">
        <h2 class="text-3xl sm:text-4xl font-bold tracking-tight">
          Technologies & Skills
        </h2>
        <div class="h-1 w-20 bg-primary rounded-full"></div>
      </div>

      <!-- Categories -->
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let category of techCategories" class="space-y-4">

          <h3 class="text-xl font-semibold text-foreground">
            {{ category.category }}
          </h3>

          <div class="space-y-3">
            <div *ngFor="let tech of category.technologies"
              class="group p-4 rounded-xl border bg-card hover:shadow-md transition-all">

              <div class="flex items-center justify-between gap-3">

                <div class="flex items-center gap-3">
                  <div class="p-2 rounded-md transition-colors
               text-muted-foreground
               group-hover:bg-primary/10
               group-hover:text-primary">
                    <i [class]="tech.icon + ' text-xl'"></i>
                  </div>

                  <span class="font-medium text-foreground">
                    {{ tech.name }}
                  </span>
                </div>

                <span class="text-xs font-semibold px-3 py-1 rounded-full border" [ngClass]="getLevelColor(tech.level)">
                  {{ tech.level }}
                </span>

              </div>
            </div>

          </div>

        </div>
      </div>

    </div>
  </div>
</section>
