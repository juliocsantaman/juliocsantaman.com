<section id="technologies" class="py-20 sm:py-32 font-sans bg-muted/30 dark:bg-background text-foreground">
  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="space-y-12">

      <!-- Header -->
      <div class="space-y-4">
        <h2 class="text-3xl sm:text-4xl font-bold tracking-tight">
          Technologies & Skills
        </h2>
        <div class="h-1 w-20 bg-primary rounded-full"></div>
      </div>

      <!-- Categories -->
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let category of techCategories" class="space-y-4">
          <h3 class="text-xl font-semibold text-foreground">
            {{ category.category }}
          </h3>

          <div class="space-y-3">
            <div *ngFor="let tech of category.technologies" class="p-4 bg-card border border-border rounded-lg shadow-md
                     hover:shadow-xl hover:-translate-y-2
                     hover:bg-muted/100 dark:hover:bg-muted/50
                     transition-all duration-200">
              <div class="flex items-center justify-between gap-3">

                <!-- Icon + name -->
                <div class="flex items-center gap-3">
                  <div class="p-2 rounded-md flex items-center justify-center
                           bg-muted text-muted-foreground
                           dark:bg-muted/40
                           transition-colors">
                    <i [class]="tech.icon + ' w-6 h-6 text-2xl'"></i>
                  </div>

                  <span class="font-medium text-foreground">
                    {{ tech.name }}
                  </span>
                </div>

                <!-- Level badge -->
                <span class="text-xs font-semibold px-3 py-1 rounded-full border" [ngClass]="getLevelColor(tech.level)">
                  {{ tech.level }}
                </span>

              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
