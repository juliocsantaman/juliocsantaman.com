<!-- HERO / HOME SECTION con Dark Mode -->
<section
  id="home"
  class="min-h-screen flex items-center relative
         bg-background text-foreground
         dark:bg-background dark:text-foreground"
>
  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid lg:grid-cols-2 gap-12 items-center">

      <!-- LEFT -->
      <div class="space-y-8">
        <div class="space-y-4">
          <h1
            class="text-5xl sm:text-6xl lg:text-7xl font-bold tracking-tight"
          >
            {{ 'ROOT.APP.ORGANISMS.HERO_ORGANISM.TITLE_LINE_1' | translate }}
            <span class="block text-primary">{{ 'ROOT.APP.ORGANISMS.HERO_ORGANISM.TITLE_LINE_2' | translate }}</span>
          </h1>

          <p
            class="text-lg sm:text-xl max-w-xl leading-relaxed
                   text-muted-foreground"
          >
            {{ 'ROOT.APP.ORGANISMS.HERO_ORGANISM.DESCRIPTION' | translate }}
          </p>
        </div>

        <div class="flex flex-wrap gap-4">
          <!-- Primary button -->
          <button
            type="button"
            class="inline-flex items-center justify-center rounded-lg
                   bg-primary px-6 py-3 text-sm font-medium
                   text-primary-foreground
                   hover:opacity-90 transition"
            (click)="scrollToSection('projects')"
          >
            {{ 'ROOT.APP.ORGANISMS.HERO_ORGANISM.BUTTONS.VIEW_PROJECTS' | translate }}
          </button>

          <!-- Outline button -->
          <button
            type="button"
            class="inline-flex items-center justify-center rounded-lg
                   border border-border px-6 py-3 text-sm font-medium
                   bg-background text-foreground
                   hover:bg-accent transition"
            (click)="scrollToSection('contact')"
          >
            {{ 'ROOT.APP.ORGANISMS.HERO_ORGANISM.BUTTONS.GET_IN_TOUCH' | translate }}
          </button>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="relative">
        <div class="relative rounded-md overflow-hidden">
          <img
            [src]="'ROOT.APP.ORGANISMS.HERO_ORGANISM.IMAGES.IMG_1.URL' | translate"
            [alt]="'ROOT.APP.ORGANISMS.HERO_ORGANISM.IMAGES.IMG_1.ALT' | translate"
            width="1920"
            height="1280"
            loading="eager"
            fetchpriority="high"
            class="w-full h-auto object-cover"
          />
        </div>
      </div>

    </div>
  </div>

  <!-- Scroll down -->
  <button
    type="button"
    class="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce"
    aria-label="Scroll to next section"
    (click)="scrollToSection('about')"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-6 h-6 text-muted-foreground"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>
</section>
